name: mosque_hub_flutter
description: "A modern Mosque Management & Prayer App for Masjid Al-Putki built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Auth & RTDB
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_database: ^11.3.1

  # State Management & UI
  provider: ^6.1.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.2
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
