<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Prayer timings, community events, and financial transparency for Masjid Al-Putki, Jharkhand." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Material Symbols Rounded (MD3) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <title>Mosque Hub — Masjid Al-Putki, Jharkhand</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #f8fafc;
        overflow-x: hidden;
      }

      /* Instant Zero-Flash Top-Level Splash Screen */
      #app-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #064e3b 0%, #022c22 70%, #011711 100%);
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
        padding: 1.5rem;
        user-select: none;
        overflow: hidden;
        opacity: 1;
        visibility: visible;
        transform: scale(1);
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #app-splash-screen.splash-fade-out {
        opacity: 0 !important;
        visibility: hidden !important;
        transform: scale(1.03) !important;
        pointer-events: none !important;
      }

      .splash-ambient-1 {
        position: absolute;
        top: -100px;
        left: -100px;
        width: 320px;
        height: 320px;
        background: rgba(16, 185, 129, 0.18);
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        animation: splashGlowPulse 4s ease-in-out infinite alternate;
      }

      .splash-ambient-2 {
        position: absolute;
        bottom: -100px;
        right: -100px;
        width: 300px;
        height: 300px;
        background: rgba(245, 158, 11, 0.12);
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        animation: splashGlowPulse 4s ease-in-out infinite alternate 2s;
      }

      .splash-emblem-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.75rem;
      }

      .splash-orbit-ring {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px dashed rgba(52, 211, 153, 0.4);
        animation: splashSpin 9s linear infinite;
      }

      .splash-orbit-glow {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.25);
        filter: blur(16px);
        animation: splashPulse 2.2s ease-in-out infinite;
      }

      .splash-card {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(6, 95, 70, 0.85) 0%, rgba(4, 120, 87, 0.85) 100%);
        border: 1px solid rgba(52, 211, 153, 0.45);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-icon {
        width: 44px;
        height: 44px;
        fill: #fcd34d;
        filter: drop-shadow(0 4px 12px rgba(251, 191, 36, 0.6));
      }

      .splash-arabic {
        font-family: 'Amiri', serif;
        font-size: 1.15rem;
        color: rgba(110, 231, 183, 0.9);
        letter-spacing: 0.1em;
        margin-bottom: 0.35rem;
        font-weight: 700;
      }

      .splash-title {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(to right, #ffffff, #a7f3d0, #fef3c7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 0.35rem 0;
      }

      .splash-subtitle {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        color: rgba(167, 243, 208, 0.85);
        text-transform: uppercase;
        margin: 0 0 1.75rem 0;
      }

      .splash-progress-track {
        width: 220px;
        height: 5px;
        background: rgba(4, 120, 87, 0.35);
        border: 1px solid rgba(52, 211, 153, 0.25);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 1rem;
      }

      .splash-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        background: linear-gradient(90deg, #34d399, #fcd34d, #34d399);
        border-radius: 9999px;
        animation: splashShimmer 1.5s ease-in-out infinite alternate;
      }

      .splash-status {
        font-size: 0.75rem;
        color: rgba(209, 250, 229, 0.75);
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .splash-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #f59e0b;
        animation: splashDotPing 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      @keyframes splashSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes splashPulse {
        0%, 100% { transform: scale(0.92); opacity: 0.6; }
        50% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes splashGlowPulse {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 0.9; }
      }

      @keyframes splashShimmer {
        0% { left: 0%; width: 25%; }
        50% { width: 45%; }
        100% { left: 75%; width: 25%; }
      }

      @keyframes splashDotPing {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.6); opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <!-- Top-level continuous splash screen that stays 100% active from start to end -->
    <div id="app-splash-screen">
      <div class="splash-ambient-1"></div>
      <div class="splash-ambient-2"></div>

      <div class="splash-emblem-wrap">
        <div class="splash-orbit-ring"></div>
        <div class="splash-orbit-glow"></div>
        <div class="splash-card">
          <svg class="splash-icon" viewBox="0 0 24 24">
            <path d="M12 2a1 1 0 0 1 1 1v1.07c2.8.34 5 2.61 5 5.43v.5h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1h1v-.5c0-2.82 2.2-5.09 5-5.43V3a1 1 0 0 1 1-1zm0 4.5c-1.93 0-3.5 1.57-3.5 3.5v.5h7v-.5c0-1.93-1.57-3.5-3.5-3.5zm0 8.5a2.5 2.5 0 0 0-2.5 2.5v2.5h5v-2.5a2.5 2.5 0 0 0-2.5-2.5z" />
          </svg>
        </div>
      </div>

      <div class="splash-arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <h1 class="splash-title">Mosque Hub</h1>
      <p class="splash-subtitle">Masjid Al-Putki • Jharkhand</p>

      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>

      <div class="splash-status">
        <span class="splash-dot"></span>
        <span>Loading Prayer Timings & Events...</span>
      </div>
    </div>

    <!-- React App Root Container -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
